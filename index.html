<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exsellent — Государственные структуры</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #0f1115;
      color: #e6e6e6;
      line-height: 1.5;
    }
    header {
      padding: 2rem 1rem;
      text-align: center;
      border-bottom: 1px solid #2e333d;
    }
    header h1 { margin: 0 0 0.5rem; font-size: 2rem; }
    header p { margin: 0; color: #a0a0a0; }
    main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .card {
      background: #1a1d23;
      border: 1px solid #2e333d;
      border-radius: 10px;
      padding: 1.25rem;
      transition: border-color 0.2s, transform 0.2s;
    }
    .card:hover { border-color: #2f6fed; transform: translateY(-2px); }
    .card-code {
      font-size: 0.75rem;
      color: #2f6fed;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .card h2 { margin: 0.5rem 0; font-size: 1.15rem; }
    .card p { margin: 0.25rem 0; color: #a0a0a0; font-size: 0.9rem; }
    .card .head { margin-top: 0.75rem; font-size: 0.85rem; color: #6ee787; }
    .section-title {
      margin: 2.5rem 0 1rem;
      font-size: 1.3rem;
      border-left: 4px solid #2f6fed;
      padding-left: 0.75rem;
    }
    .admin-card {
      background: #1a1d23;
      border: 1px solid #2e333d;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
    }
    .admin-card h3 { margin: 0 0 0.25rem; font-size: 1rem; }
    .admin-card p { margin: 0; color: #a0a0a0; font-size: 0.85rem; }
    .empty { color: #6b7280; font-style: italic; }
  </style>
</head>
<body>
  <header>
    <h1>Exsellent</h1>
    <p>Государственные структуры и администрация</p>
  </header>

  <main>
    <h2 class="section-title">Ведомства</h2>
    <div id="departments" class="grid">
      <p class="empty">Загрузка данных…</p>
    </div>

    <h2 class="section-title">Администрация</h2>
    <div id="admins">
      <p class="empty">Загрузка данных…</p>
    </div>
  </main>

  <script>
    // Экранирование HTML, чтобы данные из JSON не ломали разметку
    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadDepartments() {
      const container = document.getElementById('departments');
      try {
        const res = await fetch('data/departments.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        if (!data.departments || !data.departments.length) {
          container.innerHTML = '<p class="empty">Ведомства не добавлены.</p>';
          return;
        }

        container.innerHTML = data.departments.map(d => `
          <div class="card">
            <div class="card-code">${esc(d.code)}</div>
            <h2>${esc(d.name)}</h2>
            <p>${esc(d.description)}</p>
            ${d.head ? `<div class="head">Глава: ${esc(d.head)}</div>` : ''}
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = `<p class="empty">Не удалось загрузить ведомства: ${esc(e.message)}</p>`;
      }
    }

    async function loadAdmins() {
      const container = document.getElementById('admins');
      try {
        const res = await fetch('data/administration.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        if (!data.admins || !data.admins.length) {
          container.innerHTML = '<p class="empty">Список администрации пуст.</p>';
          return;
        }

        container.innerHTML = data.admins.map(a => `
          <div class="admin-card">
            <h3>${esc(a.name)}</h3>
            <p>${esc(a.position)}${a.department ? ' — ' + esc(a.department) : ''}${a.appointed ? ' · назначен ' + esc(a.appointed) : ''}</p>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = `<p class="empty">Не удалось загрузить администрацию: ${esc(e.message)}</p>`;
      }
    }

    loadDepartments();
    loadAdmins();
  </script>
</body>
</html>
