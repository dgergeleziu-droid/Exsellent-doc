<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет | Exsellent</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { background: #1a1d23; padding: 2rem; border-radius: 12px; border: 1px solid #2e333d; width: 100%; max-width: 400px; }
    h1 { margin-top: 0; text-align: center; font-size: 1.5rem; }
    input, select { width: 100%; padding: 0.75rem; margin: 0.5rem 0; background: #0f1115; border: 1px solid #2e333d; border-radius: 6px; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 0.75rem; margin-top: 1rem; background: #2f6fed; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; }
    button:hover { background: #1e5bd8; }
    .link-btn { background: transparent; color: #2f6fed; margin-top: 0.5rem; }
    .link-btn:hover { background: transparent; text-decoration: underline; }
    .hidden { display: none; }
    .admin-panel { border: 1px solid #6ee787; background: rgba(110, 231, 135, 0.1); padding: 1rem; border-radius: 6px; margin-top: 1.5rem; text-align: center; }
    .admin-panel a { display: inline-block; background: #6ee787; color: #000; padding: 0.5rem 1rem; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 0.5rem; }
  </style>
</head>
<body>

<div class="container">
  <!-- Форма Входа -->
  <div id="login-view">
    <h1>Вход в систему</h1>
    <input type="text" id="login-user" placeholder="Логин">
    <input type="password" id="login-pass" placeholder="Пароль">
    <button onclick="login()">Войти</button>
    <button class="link-btn" onclick="toggleView('register')">Нет аккаунта? Зарегистрироваться</button>
  </div>

  <!-- Форма Регистрации -->
  <div id="register-view" class="hidden">
    <h1>Регистрация</h1>
    <input type="text" id="reg-user" placeholder="Придумайте логин">
    <input type="password" id="reg-pass" placeholder="Придумайте пароль">
    <select id="reg-role">
      <option value="user">Гражданин</option>
      <option value="admin">Администратор</option>
    </select>
    <button onclick="register()">Создать аккаунт</button>
    <button class="link-btn" onclick="toggleView('login')">Уже есть аккаунт? Войти</button>
  </div>

  <!-- Профиль (виден после входа) -->
  <div id="profile-view" class="hidden">
    <h1>Личный кабинет</h1>
    <p>Добро пожаловать, <strong id="profile-name"></strong>!</p>
    <p>Ваша роль: <span id="profile-role"></span></p>
    
    <div id="admin-block" class="admin-panel hidden">
      <p>Вам доступна панель управления базой данных.</p>
      <a href="/admin.html">Перейти в Админ-панель</a>
    </div>

    <button onclick="logout()" style="background: #3a0e14; margin-top: 1.5rem;">Выйти</button>
    <button class="link-btn" onclick="window.location.href='/'">На главную</button>
  </div>
</div>

<script>
  // При загрузке проверяем, есть ли сессия
  window.onload = function() {
    const user = JSON.parse(localStorage.getItem('exc_user'));
    if (user) {
      showProfile(user);
    }
  };

  function toggleView(view) {
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('register-view').classList.add('hidden');
    document.getElementById('profile-view').classList.add('hidden');
    
    if (view === 'login') document.getElementById('login-view').classList.remove('hidden');
    if (view === 'register') document.getElementById('register-view').classList.remove('hidden');
    if (view === 'profile') document.getElementById('profile-view').classList.remove('hidden');
  }

  function register() {
    const username = document.getElementById('reg-user').value.trim();
    const password = document.getElementById('reg-pass').value.trim();
    const role = document.getElementById('reg-role').value;

    if (!username || !password) return alert('Заполните все поля!');

    // В реальности здесь должен быть запрос к БД. Для статики используем LocalStorage
    let users = JSON.parse(localStorage.getItem('exc_users') || '[]');
    
    if (users.find(u => u.username === username)) {
      return alert('Пользователь с таким логином уже существует!');
    }

    const newUser = { username, password, role };
    users.push(newUser);
    localStorage.setItem('exc_users', JSON.stringify(users));
    
    // Автоматический вход после регистрации
    localStorage.setItem('exc_user', JSON.stringify(newUser));
    showProfile(newUser);
  }

  function login() {
    const username = document.getElementById('login-user').value.trim();
    const password = document.getElementById('login-pass').value.trim();

    let users = JSON.parse(localStorage.getItem('exc_users') || '[]');
    const user = users.find(u => u.username === username && u.password === password);

    if (user) {
      localStorage.setItem('exc_user', JSON.stringify(user));
      showProfile(user);
    } else {
      alert('Неверный логин или пароль!');
    }
  }

  function showProfile(user) {
    toggleView('profile');
    document.getElementById('profile-name').textContent = user.username;
    document.getElementById('profile-role').textContent = user.role === 'admin' ? 'Администратор' : 'Гражданин';
    
    if (user.role === 'admin') {
      document.getElementById('admin-block').classList.remove('hidden');
    } else {
      document.getElementById('admin-block').classList.add('hidden');
    }
  }

  function logout() {
    localStorage.removeItem('exc_user');
    toggleView('login');
  }
</script>
</body>
</html>
