<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель | Exsellent</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background: #0f1115; color: #e6e6e6; }
    h1 { font-size: 1.5rem; }
    .warning { background: #3a2a00; border-left: 4px solid #ffb300; padding: 1rem; margin: 1rem 0; font-size: 0.9rem; }
    label { display: block; margin-top: 1rem; color: #a0a0a0; font-size: 0.9rem;}
    input, textarea { width: 100%; padding: 0.6rem; margin-top: 0.3rem; background: #1a1d23; border: 1px solid #2e333d; border-radius: 6px; color: #e6e6e6; font-family: monospace; box-sizing: border-box;}
    button { margin-top: 1rem; padding: 0.6rem 1.2rem; background: #2f6fed; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;}
    button:hover { background: #1e5bd8; }
    .status { margin-top: 1rem; padding: 0.6rem; border-radius: 6px; display: none; }
    .ok { background: #0e3a1f; color: #6ee787; }
    .err { background: #3a0e14; color: #ff7b72; }
  </style>
</head>
<body>
  <h1>Админ-панель (База Данных)</h1>
  <div class="warning">
    <strong>Внимание:</strong> для сохранения нужен GitHub Token (Fine-grained с правами Contents: Read and write). Токен не сохраняется на сервере.
  </div>

  <label>GitHub Token <input type="password" id="token" placeholder="ghp_..."></label>
  <label>Владелец репозитория <input id="owner" value="dgergeleziu-droid"></label>
  <label>Репозиторий <input id="repo" value="Exsellent-doc"></label>
  <label>Путь к файлу <input id="path" value="data/administration.json"></label>

  <button onclick="loadFile()">Загрузить текущие данные</button>
  <div id="editor" style="margin-top:1rem;"></div>
  <button id="saveBtn" onclick="saveFile()" style="display:none;">Сохранить изменения</button>
  <div class="status" id="status"></div>

  <script>
    const apiBase = 'https://api.github.com/repos';
    let currentSha = null;
    const statusEl = document.getElementById('status');

    function showStatus(msg, isError) {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + (isError ? 'err' : 'ok');
      statusEl.style.display = 'block';
    }

    function encodeBase64(str) { return btoa(unescape(encodeURIComponent(str))); }
    function decodeBase64(str) { return decodeURIComponent(escape(atob(str))); }

    async function loadFile() {
      const token = document.getElementById('token').value.trim();
      const owner = document.getElementById('owner').value.trim();
      const repo = document.getElementById('repo').value.trim();
      const path = document.getElementById('path').value.trim();
      if (!token) return showStatus('Введите токен!', true);

      try {
        const res = await fetch(`${apiBase}/${owner}/${repo}/contents/${path}`, {
          headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
        });
        if (!res.ok) throw new Error(`Ошибка ${res.status}`);
        const data = await res.json();
        currentSha = data.sha;
        
        let content = Array.isArray(data.content) ? decodeBase64(data.content.join('')) : decodeBase64(data.content);
        
        document.getElementById('editor').innerHTML = `<textarea id="jsonContent" rows="15">${content}</textarea>`;
        document.getElementById('saveBtn').style.display = 'inline-block';
        showStatus('Файл загружен. Можете редактировать JSON.', false);
      } catch (e) {
        showStatus('Ошибка загрузки: ' + e.message, true);
      }
    }

    async function saveFile() {
      const token = document.getElementById('token').value.trim();
      const owner = document.getElementById('owner').value.trim();
      const repo = document.getElementById('repo').value.trim();
      const path = document.getElementById('path').value.trim();
      const content = document.getElementById('jsonContent').value;
      
      if (!token || !currentSha) return showStatus('Сначала загрузите файл!', true);

      try { JSON.parse(content); } catch (e) { return showStatus('Ошибка: невалидный JSON!', true); }

      try {
        const res = await fetch(`${apiBase}/${owner}/${repo}/contents/${path}`, {
          method: 'PUT',
          headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: `Обновление ${path} из админки`,
            content: encodeBase64(content),
            sha: currentSha
          })
        });
        if (!res.ok) throw new Error(`Ошибка ${res.status}`);
        const data = await res.json();
        currentSha = data.content.sha;
        showStatus('Успешно сохранено в GitHub!', false);
      } catch (e) {
        showStatus('Ошибка сохранения: ' + e.message, true);
      }
    }
  </script>
</body>
</html>
